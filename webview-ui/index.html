<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>mdz Webview</title>
    <link rel="stylesheet" href="./src/styles/global.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
    <script>
      const conversation = document.getElementById('conversation');
      const textarea = document.querySelector('textarea');
      document.getElementById('send-btn').onclick = () => {
        if (!textarea.value.trim()) return;
        addMessage('user', textarea.value);
        textarea.value = '';
        setTimeout(
          () =>
            addMessage('ai', 'This is a simulated AI response for UI preview.'),
          600,
        );
      };
      function addMessage(role, text) {
        const msg = document.createElement('div');
        msg.className = 'message ' + role;
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.innerText = text;
        msg.appendChild(bubble);
        conversation.appendChild(msg);
        conversation.scrollTop = conversation.scrollHeight;
      }
      document.querySelectorAll('.context-action').forEach((btn) => {
        btn.onclick = () => {
          const pill = document.createElement('div');
          pill.className = 'context-pill';
          pill.innerText = btn.innerText;
          document.getElementById('context-bar').prepend(pill);
        };
      });
      document.getElementById('plan-btn').onclick = () => {
        document.getElementById('overlay-content').innerHTML =
          '<div class="diff-block">- const a = 1;<br>+ const a = 42;</div>';
        document.getElementById('overlay').classList.add('active');
      };
      document.getElementById('close-overlay').onclick = () => {
        document.getElementById('overlay').classList.remove('active');
      };
      document.getElementById('open-dashboard').onclick = () => {
        document.getElementById('dashboard-modal').classList.add('active');
      };
      document.getElementById('close-dashboard').onclick = () => {
        document.getElementById('dashboard-modal').classList.remove('active');
      };
      document.getElementById('open-appgen').onclick = () => {
        document.getElementById('appgen-modal').classList.add('active');
      };
      document.getElementById('close-appgen').onclick = () => {
        document.getElementById('appgen-modal').classList.remove('active');
      };
    </script>
  </body>
</html>
